<svg xmlns="http://www.w3.org/2000/svg" width="280" height="220" viewBox="0 0 280 220">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a505a"/>
      <stop offset="1" stop-color="#15171b"/>
    </linearGradient>
    <linearGradient id="bodyFar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#383d45"/>
      <stop offset="1" stop-color="#101215"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b4048"/>
      <stop offset="1" stop-color="#1a1c20"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity=".28"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ombre portée -->
  <ellipse cx="150" cy="200" rx="105" ry="10" fill="url(#shadow)"/>

  <!-- tour de nuque (derrière) -->
  <path d="M206 92 C 232 150, 196 188, 150 186 C 112 184, 92 160, 96 128"
        fill="none" stroke="url(#band)" stroke-width="9" stroke-linecap="round"/>

  <!-- transducteur éloigné + contour d'oreille -->
  <path d="M196 70 C 198 44, 226 40, 232 62 C 236 78, 222 92, 206 94"
        fill="none" stroke="#2a2d33" stroke-width="7" stroke-linecap="round"/>
  <rect x="182" y="58" width="26" height="42" rx="12" fill="url(#bodyFar)"
        transform="rotate(-12 195 79)"/>

  <!-- contour d'oreille proche -->
  <path d="M84 84 C 86 50, 124 42, 132 70 C 138 92, 120 118, 98 126"
        fill="none" stroke="url(#band)" stroke-width="9" stroke-linecap="round"/>
  <path d="M86 78 C 90 56, 118 50, 126 68" fill="none" stroke="#ffffff" stroke-opacity=".14"
        stroke-width="2" stroke-linecap="round"/>

  <!-- perche micro -->
  <path d="M72 116 C 70 150, 96 170, 146 168" fill="none" stroke="#1f2227"
        stroke-width="6" stroke-linecap="round"/>
  <path d="M72 116 C 70 150, 96 170, 146 168" fill="none" stroke="#ffffff" stroke-opacity=".10"
        stroke-width="1.5" stroke-linecap="round"/>
  <rect x="140" y="160" width="26" height="15" rx="7.5" fill="url(#body)"/>
  <rect x="147" y="165" width="12" height="5" rx="2.5" fill="#0b0c0e" opacity=".7"/>

  <!-- transducteur proche -->
  <rect x="60" y="68" width="40" height="62" rx="18" fill="url(#body)"
        transform="rotate(-10 80 99)"/>
  <rect x="60" y="68" width="40" height="62" rx="18" fill="none" stroke="#ffffff"
        stroke-opacity=".16" stroke-width="1.5" transform="rotate(-10 80 99)"/>
  <!-- bouton multifonction -->
  <circle cx="80" cy="99" r="8" fill="#101216"/>
  <circle cx="80" cy="99" r="8" fill="none" stroke="#ffffff" stroke-opacity=".2"/>
  <!-- LED -->
  <circle cx="72" cy="80" r="2" fill="#57e389"/>
</svg>
